<div class="container">
  <div  class="category-container hideScroll" fxLayout="row nowrap" fxLayout.lt-lg="row wrap" #carousel>
    <div class="category" [ngStyle]="{'flex':'0 0 33%','height':'30vh'}" [ngStyle.lt-lg]="{'flex':'0 0 50%','height':'25vh'}" [ngStyle.lt-sm]="{'flex':'0 0 100%','height':'25vh'}"
    fxLayoutAlign="center center" *ngFor="let i of categoryData">
    <div class="inner" style="width: 80%;height: 90%;position:relative;" [ngStyle]="{'background-color':i?.color}"  fxLayoutAlign="center center">
      <img style="height: 80%;object-fit: contain;" [src]="i?.image" alt="{{ null }}" onerror="this.src='../../../../assets/no-image.png'" class="product-image" />
      <div class="text" style="color: white;position: absolute;bottom: 10px;left: 15px;">{{i?.text}}</div>
    </div>
  </div>
</div>
</div>
